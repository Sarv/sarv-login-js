name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 18 is the floor declared in `engines`; 22 is what most consumers run.
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: the generated logo must match the asset
        # If someone edits src/logo.generated.ts by hand, or changes the asset
        # without regenerating, the working tree is dirty after a build - and
        # the published mark would differ from the theme's.
        run: |
          npm run gen:logo
          git diff --exit-code src/logo.generated.ts
